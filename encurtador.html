<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecionando...</title>
<style>
 body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:30px}
 #timer{font-size:60px}
 button{padding:15px 30px;font-size:18px;background:#00ff88;border:none;border-radius:10px;margin-top:20px}
</style>
</head>
<body>
<h2 id="msg">Carregando link...</h2>
<p>Aguarde <span id="timer">5</span>s</p>
<button id="btn" style="display:none">CONTINUAR</button>
<p id="debug" style="color:#888;font-size:12px;margin-top:30px"></p>

<script>
// SEUS LINKS AQUI DIRETO - SEM PRECISAR DE links.json
const links = {
  "zap": "https://wa.me/5500000000000",
  "teste": "https://google.com",
  "insta": "https://instagram.com/rtmods23"
};

const params = new URLSearchParams(window.location.search);
const codigo = params.get('c');

document.getElementById('debug').innerText = `Código recebido: "${codigo}" | Links disponíveis: ${Object.keys(links).join(', ')}`;

if(!codigo){
  document.getElementById('msg').innerText = 'Nenhum código! Use?c=zap no final do link';
} else if(!links[codigo]){
  document.getElementById('msg').innerText = `Link "${codigo}" não encontrado`;
} else {
  const destino = links[codigo];
  document.getElementById('msg').innerText = 'Seu link está quase pronto!';
  let tempo = 5;
  const intervalo = setInterval(()=>{
    tempo--;
    document.getElementById('timer').innerText = tempo;
    if(tempo<=0){
      clearInterval(intervalo);
      document.getElementById('btn').style.display='block';
    }
  },1000);
  document.getElementById('btn').onclick = ()=> window.location.href = destino;
}
</script>
</body>
</html>

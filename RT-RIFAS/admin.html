<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Rifa</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --sold: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 500px; width: 100%; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .login-box input {
      width: 100%;
      padding: 14px;
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      margin: 8px 0;
      font-family: 'Poppins', sans-serif;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
      font-family: 'Poppins', sans-serif;
    }
    .btn:hover { background: #16a34a; }
    .btn-sair {
      background: var(--red);
      color: white;
      margin-bottom: 16px;
    }
    .btn-sair:hover { background: #dc2626; }
    h1 { text-align: center; margin-bottom: 24px; }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .stats b { color: var(--green); }
    .numeros-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin: 16px 0;
    }
    .numero {
      background: var(--green);
      color: #000;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }
    .numero:hover { transform: scale(1.1); }
    .vendido {
      background: var(--red);
      color: white;
    }
    .vendido:hover { background: #dc2626; }
    .legenda { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); margin-top: 12px; justify-content: center; }
    .legenda div { display: flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 3px; }
    .dot.livre { background: var(--green); }
    .dot.vendido { background: var(--red); }
    .erro { color: var(--red); font-size: 14px; text-align: center; margin-top: 8px; display: none; }
    #painel { display: none; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- TELA DE LOGIN -->
    <div class="card login-box" id="login">
      <h1>Painel Admin 🔐</h1>
      <input type="text" id="usuario" placeholder="Usuário" autocomplete="username">
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
      <button class="btn" onclick="fazerLogin()">Entrar</button>
      <p class="erro" id="erro-login">Usuário ou senha incorretos</p>
    </div>

    <!-- PAINEL DE NÚMEROS -->
    <div id="painel">
      <button class="btn btn-sair" onclick="sair()">Sair do Painel</button>
      <div class="card">
        <h1>Gerenciar Números</h1>
        <div class="stats">
          <span>Vendidos: <b id="qtd-vendidos">0</b></span>
          <span>Disponíveis: <b id="qtd-disponiveis">100</b></span>
          <span>Total: <b>100</b></span>
        </div>
        <p style="color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 8px;">
          Clique para marcar como vendido/liberar
        </p>
        <div class="numeros-grid" id="numeros"></div>
        <div class="legenda">
          <div><div class="dot livre"></div> Disponível</div>
          <div><div class="dot vendido"></div> Vendido</div>
        </div>
      </div>
    </div>

  </div>

<script>
  // ===== CONFIGURAÇÃO DO LOGIN - TROQUE AQUI =====
  const ADMIN_USER = 'admin';
  const ADMIN_PASS = 'rifa123';
  const TOTAL_NUMEROS = 100;
  // ===============================================

  let numerosVendidos = JSON.parse(localStorage.getItem('rifa_vendidos') || '[]');

  // Verifica se já tá logado
  if (localStorage.getItem('rifa_admin_logado') === 'true') {
    mostrarPainel();
  }

  function fazerLogin() {
    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;
    
    if (usuario === ADMIN_USER && senha === ADMIN_PASS) {
      localStorage.setItem('rifa_admin_logado', 'true');
      mostrarPainel();
    } else {
      document.getElementById('erro-login').style.display = 'block';
    }
  }

  function sair() {
    localStorage.removeItem('rifa_admin_logado');
    location.reload();
  }

  function mostrarPainel() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    renderizarNumeros();
  }

  function renderizarNumeros() {
    let html = '';
    document.getElementById('qtd-vendidos').textContent = numerosVendidos.length;
    document.getElementById('qtd-disponiveis').textContent = TOTAL_NUMEROS - numerosVendidos.length;

    for(let i = 1; i <= TOTAL_NUMEROS; i++) {
      if(numerosVendidos.includes(i)) {
        html += `<div class="numero vendido" onclick="toggleNumero(${i})">${i.toString().padStart(2, '0')}</div>`;
      } else {
        html += `<div class="numero" onclick="toggleNumero(${i})">${i.toString().padStart(2, '0')}</div>`;
      }
    }
    document.getElementById('numeros').innerHTML = html;
  }

  function toggleNumero(num) {
    if (numerosVendidos.includes(num)) {
      numerosVendidos = numerosVendidos.filter(n => n !== num);
    } else {
      numerosVendidos.push(num);
    }
    localStorage.setItem('rifa_vendidos', JSON.stringify(numerosVendidos));
    renderizarNumeros();
  }

  // Enter pra logar
  document.getElementById('senha').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') fazerLogin();
  });
</script>

</body>
</html>

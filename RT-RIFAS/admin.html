<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | RT-RIFAS</title>
  <style>
    body { font-family: Arial; background: #0f172a; color: #f1f5f9; padding: 16px; margin: 0; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 16px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #22c55e; color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 12px; }
    .erro { color: #ef4444; display: none; text-align: center; margin-top: 8px; }
    #painel { display: none; }
    h1 { text-align: center; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="login">
      <h1>Painel Admin 🔐</h1>
      <input type="text" id="usuario" placeholder="Usuário" value="admin">
      <input type="password" id="senha" placeholder="Senha" value="rtmods">
      <button onclick="fazerLogin()">Entrar</button>
      <p class="erro" id="erro-login">Usuário ou senha incorretos</p>
    </div>

    <div class="card" id="painel">
      <h1>✅ Logou no Painel!</h1>
      <p style="text-align:center;">Login funcionando. Próximo passo: adicionar Supabase.</p>
      <button onclick="sair()">Sair</button>
    </div>
  </div>

<script>
alert('JavaScript carregou!'); // Se aparecer isso, o JS tá OK

const ADMIN_USER = "admin";
const ADMIN_PASS = "rtmods";

function fazerLogin() {
  alert('Botão clicou!'); // Debug
  const usuario = document.getElementById('usuario').value;
  const senha = document.getElementById('senha').value;
  
  if (usuario === ADMIN_USER && senha === ADMIN_PASS) {
    alert('Login correto!');
    localStorage.setItem('rifa_admin_logado', 'true');
    mostrarPainel();
  } else {
    alert('Login errado!');
    document.getElementById('erro-login').style.display = 'block';
  }
}

function mostrarPainel() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
}

function sair() {
  localStorage.removeItem('rifa_admin_logado');
  location.reload();
}

if (localStorage.getItem('rifa_admin_logado') === 'true') {
  mostrarPainel();
}
</script>

</body>
</html>

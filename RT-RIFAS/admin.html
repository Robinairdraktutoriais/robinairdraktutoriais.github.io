<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Teste</title>
  <style>
    body { font-family: Arial; background: #0f172a; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 16px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #22c55e; color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 12px; }
    .erro { color: #ef4444; display: none; text-align: center; margin-top: 8px; }
    #painel { display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="card" id="login">
    <h1>Painel Admin 🔐</h1>
    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
    <p class="erro" id="erro-login">Usuário ou senha incorretos</p>
  </div>

  <div class="card" id="painel">
    <h1>✅ Logou!</h1>
    <p>Login funcionando com config.js</p>
    <button onclick="sair()">Sair</button>
  </div>

<script src="config.js"></script>
<script>
  // Debug: mostra se config.js carregou
  console.log('CONFIG existe?', typeof CONFIG !== 'undefined' ? CONFIG : 'NÃO CARREGOU');

  let ADMIN_USER = "admin";
  let ADMIN_PASS = "rtmods";
  
  try {
    if (typeof CONFIG !== 'undefined' && CONFIG.USER && CONFIG.PASS) {
      ADMIN_USER = CONFIG.USER;
      ADMIN_PASS = CONFIG.PASS;
      console.log('Usando login do config.js:', ADMIN_USER);
    } else {
      console.log('Usando login padrão: admin/rtmods');
    }
  } catch(e) {
    console.error('Erro ao ler CONFIG:', e);
  }

  if (localStorage.getItem('rifa_admin_logado') === 'true') {
    mostrarPainel();
  }

  function fazerLogin() {
    console.log('Botão clicado');
    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;
    
    console.log('Comparando:', usuario, senha, 'com', ADMIN_USER, ADMIN_PASS);
    
    if (usuario === ADMIN_USER && senha === ADMIN_PASS) {
      localStorage.setItem('rifa_admin_logado', 'true');
      mostrarPainel();
    } else {
      document.getElementById('erro-login').style.display = 'block';
    }
  }

  function mostrarPainel() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
  }

  function sair() {
    localStorage.removeItem('rifa_admin_logado');
    location.reload();
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT RIFAS - Supabase V4 (Key Nova)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif} .num{transition:.15s} .num:active{transform:scale(.9)}</style>
</head>
<body class="bg-[#0f0f12] text-white min-h-screen">
<div id="app"></div>
<script>
// === CONFIG CORRIGIDO COM A NOVA KEY ===
const SUPABASE_URL = "https://niedwjyzvmkgwfdwhacf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_BeKGb9qgbH7kYV4VrB9G1Q_pT76F08h";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user=null, rifas=[], currentRifa=null, numeros=[], selecionados=new Set(), view='home';

async function init(){
  const {data}=await supabaseClient.auth.getSession(); 
  user=data.session?.user||null;
  supabaseClient.auth.onAuthStateChange((e,s)=>{
    user=s?.user||null; 
    if(e==='SIGNED_IN'){ view='home'; location.hash=''; }
    render(); 
    if(user) loadRifas();
  });
  await loadRifas(); 
  checkHash(); 
  render();
}

window.addEventListener('hashchange', checkHash);
function checkHash(){
  const h=location.hash;
  if(h.startsWith('#rifa/')){view='rifa'; loadRifa(h.split('/')[1]);}
  else if(h=='#painel') view='painel';
  else if(h=='#criar') view='criar';
  else if(h=='#login') view='login';
  else view='home';
  render();
}

async function loadRifas(){
  const {data, error}=await supabaseClient.from('rifas').select('*').eq('status','ativa').order('created_at',{ascending:false});
  if(error) console.log('Erro loadRifas', error.message);
  if(data) rifas=data; 
  render(); 
  if(view==='painel') loadMeuPainel();
}

async function loadRifa(id){
  const {data}=await supabaseClient.from('rifas').select('*').eq('id',id).single();
  if(!data){alert('Rifa não encontrada'); location.hash=''; return;}
  currentRifa=data; 
  await loadNumeros(id);
  supabaseClient.channel('rifa-'+id).on('postgres_changes',{event:'*',schema:'public',table:'numeros',filter:`rifa_id=eq.${id}`},()=>loadNumeros(id)).subscribe();
}

async function loadNumeros(rifaId){
  const {data}=await supabaseClient.from('numeros').select('*').eq('rifa_id',rifaId).order('numero');
  numeros=data||[]; render();
}

async function loadMeuPainel(){
  if(!user) return;
  const {data}=await supabaseClient.from('rifas').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});
  rifas=data||[]; render();
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML=`
  <header class="sticky top-0 z-20 bg-[#0f0f12]/90 backdrop-blur border-b border-white/10 p-4 flex justify-between items-center">
    <div onclick="location.hash=''; view='home'; render()" class="cursor-pointer flex items-center gap-2"><div class="w-8 h-8 bg-violet-600 rounded-lg flex items-center justify-center font-black">RT</div><b>RT RIFAS</b><span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full ml-2">ONLINE</span></div>
    <div class="flex gap-2 items-center">
      ${user?`<span class="text-xs text-white/60 hidden md:block">${user.email}</span><button onclick="criarView()" class="bg-violet-600 px-4 py-2 rounded-full text-sm font-bold">+ Criar</button><button onclick="painelView()" class="bg-white/10 px-4 py-2 rounded-full text-sm">Painel</button><button onclick="logout()" class="text-white/50 text-sm">Sair</button>`:`<button onclick="loginView()" class="bg-white text-black px-5 py-2 rounded-full text-sm font-bold">Entrar</button>`}
    </div>
  </header>
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    ${view==='login'?renderLogin():''}
    ${view==='home'?renderHome():''}
    ${view==='criar'?renderCriar():''}
    ${view==='rifa'?renderRifaPage():''}
    ${view==='painel'?renderPainel():''}
  </main>
  <div id="modal" class="fixed inset-0 hidden z-50"></div>`;
}

function renderLogin(){
  return `<div class="max-w-sm mx-auto mt-20 bg-[#1a1a20] p-8 rounded-[24px] border border-white/10">
    <h1 class="text-2xl font-black mb-2">Entrar / Cadastrar</h1><p class="text-white/50 text-sm mb-6">Conectado: ${SUPABASE_URL.slice(8,25)}...</p>
    <input id="email" placeholder="Email" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-3 outline-none focus:border-violet-600">
    <input id="senha" type="password" placeholder="Senha (min 6 caracteres)" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-4 outline-none">
    <button onclick="doLogin()" class="w-full bg-violet-600 p-3 rounded-xl font-bold mb-3">Entrar</button>
    <button onclick="doCadastro()" class="w-full bg-white/10 p-3 rounded-xl font-bold">Cadastrar</button>
    <p id="authMsg" class="text-xs text-center mt-4 text-white/40 min-h-[16px]"></p>
    <p class="text-[10px] text-white/20 text-center mt-2">Key: ${SUPABASE_ANON_KEY.slice(0,20)}...</p>
  </div>`;
}

function renderHome(){
  if(!rifas.length) return `<div class="text-center mt-20"><h2 class="text-2xl font-bold">Nenhuma rifa ativa</h2><p class="text-white/50 mt-2">Crie a primeira no seu banco real</p><button onclick="criarView()" class="mt-6 bg-violet-600 px-8 py-3 rounded-full font-bold">+ Criar Rifa</button></div>`;
  return `<h1 class="text-3xl font-black mb-6">Rifas Ativas • ${rifas.length}</h1><div class="grid md:grid-cols-3 gap-4">${rifas.map(r=>`<div onclick="location.hash='#rifa/${r.id}'" class="cursor-pointer bg-[#1a1a20] rounded-[20px] overflow-hidden border border-white/5 hover:border-violet-600/50 transition"><img src="${r.foto||'https://images.unsplash.com/photo-1607083206968-13611e3d76db?w=400'}" class="w-full h-48 object-cover"><div class="p-4"><h3 class="font-bold line-clamp-1">${r.titulo}</h3><p class="text-xs text-white/50 mt-1">${r.total_numeros} números • R$ ${Number(r.valor).toFixed(2)}/nº</p><div class="mt-3 flex justify-between items-center"><span class="text-violet-400 font-bold text-sm">Ver rifa →</span><span class="text-[10px] bg-white/10 px-2 py-1 rounded-full">${r.status}</span></div></div></div>`).join('')}</div>`;
}

function renderCriar(){
  if(!user){loginView(); return '';}
  return `<div class="max-w-xl mx-auto bg-[#1a1a20] p-6 md:p-8 rounded-[24px] border border-white/10">
    <h1 class="text-2xl font-black mb-6">Criar Nova Rifa</h1>
    <input id="c_titulo" placeholder="Ex: Kit M10 30 números" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-3">
    <input id="c_foto" placeholder="Link da foto (https://)" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-3">
    <div class="grid grid-cols-2 gap-3 mb-3"><select id="c_qtd" class="bg-black/50 border border-white/10 rounded-xl p-3"><option value="10">10 números</option><option value="30" selected>30 números</option><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="500">500</option></select><input id="c_valor" type="number" step="0.01" value="5" placeholder="Valor R$" class="bg-black/50 border border-white/10 rounded-xl p-3"></div>
    <textarea id="c_desc" placeholder="Descrição do prêmio" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-3"></textarea>
    <input id="c_pix" placeholder="Sua chave PIX (vai direto pra você)" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-3">
    <input id="c_whats" placeholder="Seu WhatsApp com DDD ex: 38999999999" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-4">
    <button onclick="doCriar()" id="btnCriar" class="w-full bg-violet-600 p-4 rounded-xl font-black text-lg">CRIAR NO SUPABASE</button>
  </div>`;
}

function renderRifaPage(){
  if(!currentRifa) return `<p class="text-center mt-20">Carregando...</p>`;
  const disponiveis=numeros.filter(n=>n.status==='disponivel').length;
  const reservados=numeros.filter(n=>n.status==='reservado').length;
  const pagos=numeros.filter(n=>n.status==='pago').length;
  const total=currentRifa.total_numeros;
  const progress=Math.round((pagos+reservados)/total*100);
  return `<div class="grid md:grid-cols-[340px_1fr] gap-6">
    <div class="bg-[#1a1a20] rounded-[24px] overflow-hidden border border-white/10 h-fit"><img src="${currentRifa.foto}" class="w-full h-64 object-cover"><div class="p-5"><h1 class="text-xl font-black">${currentRifa.titulo}</h1><p class="text-white/60 text-sm mt-2">${currentRifa.descricao||''}</p><div class="mt-4"><div class="flex justify-between text-xs mb-1"><span>${progress}% vendido</span><span>${pagos+reservados}/${total}</span></div><div class="w-full h-2 bg-white/10 rounded-full"><div class="h-2 bg-violet-600 rounded-full" style="width:${progress}%"></div></div></div><div class="mt-4 bg-black/40 p-3 rounded-xl"><p class="text-xs text-white/40">PIX organizador</p><p class="font-mono text-sm break-all mt-1">${currentRifa.pix}</p></div></div></div>
    <div class="bg-[#1a1a20] rounded-[24px] p-5 border border-white/10">
      <div class="flex flex-wrap gap-3 mb-4 text-[11px]"><span class="flex items-center gap-1"><span class="w-3 h-3 bg-[#2a2a32] rounded"></span> Livre (${disponiveis})</span><span class="flex items-center gap-1"><span class="w-3 h-3 bg-yellow-400 rounded"></span> Selecionado</span><span class="flex items-center gap-1"><span class="w-3 h-3 bg-orange-500 rounded"></span> Reservado</span><span class="flex items-center gap-1"><span class="w-3 h-3 bg-green-500 rounded"></span> Pago</span></div>
      <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">${numeros.map(n=>{
        let cls='bg-[#2a2a32] hover:bg-white/20 text-white';
        if(n.status==='reservado') cls='bg-orange-500 text-black cursor-not-allowed';
        if(n.status==='pago') cls='bg-green-500 text-black cursor-not-allowed';
        if(selecionados.has(n.numero)) cls='bg-yellow-400 text-black ring-2 ring-violet-600';
        return `<button ${n.status!=='disponivel'?'disabled':''} onclick="toggleNum(${n.numero})" class="num ${cls} aspect-square rounded-xl font-bold text-sm flex items-center justify-center">${String(n.numero).padStart(2,'0')}</button>`;
      }).join('')}</div>
      <div class="mt-6 bg-black/40 p-4 rounded-2xl border border-white/5">
        <p class="font-bold">Selecionados: ${selecionados.size} • Total: R$ ${(selecionados.size*Number(currentRifa.valor)).toFixed(2)}</p>
        <div class="grid grid-cols-2 gap-3 mt-3"><input id="b_nome" placeholder="Seu nome" class="bg-[#1a1a20] border border-white/10 rounded-xl p-3"><input id="b_whats" placeholder="Seu WhatsApp" class="bg-[#1a1a20] border border-white/10 rounded-xl p-3"></div>
        <button onclick="reservar()" class="w-full mt-3 bg-violet-600 p-4 rounded-xl font-black">RESERVAR AGORA</button>
      </div>
    </div>
  </div>`;
}

function renderPainel(){
  if(!user){loginView(); return '';}
  return `<h1 class="text-2xl font-black mb-6">Meu Painel</h1>${!rifas.length?'<p class="text-white/50">Você ainda não criou rifas</p>':''}<div class="space-y-4">${rifas.map(r=>`<div class="bg-[#1a1a20] p-5 rounded-2xl border border-white/10"><div class="flex justify-between items-start"><div><h3 class="font-bold">${r.titulo}</h3><p class="text-xs text-white/50">ID: ${r.id.slice(0,8)} • ${r.total_numeros} nº • R$ ${r.valor}</p><a href="#rifa/${r.id}" class="text-xs text-violet-400">Abrir link público</a></div><button onclick="abrirGerenciar('${r.id}')" class="bg-white/10 px-4 py-2 rounded-full text-sm">Gerenciar</button></div><div id="ger-${r.id}" class="hidden mt-4"></div></div>`).join('')}</div>`;
}

// === NAVEGAÇÃO CORRIGIDA ===
function loginView(){ view='login'; location.hash='#login'; render(); }
function criarView(){ view='criar'; location.hash='#criar'; render(); }
function painelView(){ view='painel'; location.hash='#painel'; loadMeuPainel(); }

async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  const msg=document.getElementById('authMsg');
  msg.innerText='Entrando...';
  const {error}=await supabaseClient.auth.signInWithPassword({email,password:senha});
  if(error) msg.innerText='Erro: '+error.message;
  else { msg.innerText='Logado!'; location.hash=''; view='home'; await loadRifas(); render();}
}

async function doCadastro(){
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  const msg=document.getElementById('authMsg');
  if(!email || !senha){ msg.innerText='Digite email e senha (min 6)'; return; }
  msg.innerText='Cadastrando...';
  const {data,error}=await supabaseClient.auth.signUp({email,password:senha});
  if(error){ msg.innerText='Erro: '+error.message; return; }
  // Tenta criar profile, mas não falha se não existir tabela
  if(data.user){ 
    try { await supabaseClient.from('profiles').insert({id:data.user.id,email}); } catch(e){ console.log('profiles opcional', e) }
  }
  msg.innerText='Cadastro ok! Se ativou confirmação de email, olhe seu Gmail. Já pode clicar em Entrar.';
  msg.className='text-xs text-center mt-4 text-green-400';
}

async function logout(){await supabaseClient.auth.signOut(); user=null; location.hash=''; view='home'; render(); loadRifas();}

async function doCriar(){
  const btn=document.getElementById('btnCriar'); btn.innerText='CRIANDO...'; btn.disabled=true;
  const titulo=document.getElementById('c_titulo').value;
  const foto=document.getElementById('c_foto').value||'https://images.unsplash.com/photo-1607083206968-13611e3d76db?w=600';
  const total=parseInt(document.getElementById('c_qtd').value);
  const valor=parseFloat(document.getElementById('c_valor').value);
  const desc=document.getElementById('c_desc').value;
  const pix=document.getElementById('c_pix').value;
  const whats=document.getElementById('c_whats').value;
  if(!titulo||!valor||!pix){alert('Preencha titulo, valor e pix'); btn.innerText='CRIAR NO SUPABASE'; btn.disabled=false; return;}
  const {data,error}=await supabaseClient.from('rifas').insert({owner_id:user.id,titulo,foto,total_numeros:total,valor,descricao:desc,pix,whatsapp:whats,status:'ativa'}).select().single();
  if(error){alert('Erro: '+error.message+'\nRode o SQL de criação das tabelas no Supabase!'); btn.innerText='CRIAR NO SUPABASE'; btn.disabled=false; return;}
  const nums=Array.from({length:total},(_,i)=>({rifa_id:data.id,numero:i+1,status:'disponivel'}));
  for(let i=0;i<nums.length;i+=100){await supabaseClient.from('numeros').insert(nums.slice(i,i+100));}
  alert('Rifa criada!'); location.hash='#rifa/'+data.id;
}

function toggleNum(n){if(selecionados.has(n)) selecionados.delete(n); else selecionados.add(n); render();}

async function reservar(){
  if(!selecionados.size) return alert('Selecione números');
  const nome=document.getElementById('b_nome').value; const whats=document.getElementById('b_whats').value;
  if(!nome||!whats) return alert('Digite nome e whats');
  const nums=Array.from(selecionados);
  for(let num of nums){await supabaseClient.from('numeros').update({status:'reservado',comprador_nome:nome,comprador_whats:whats}).eq('rifa_id',currentRifa.id).eq('numero',num);}
  const total=nums.length*Number(currentRifa.valor); selecionados.clear();
  document.getElementById('modal').innerHTML=`<div class="min-h-screen bg-black/80 flex items-center justify-center p-4"><div class="bg-[#1a1a20] p-8 rounded-[24px] max-w-sm w-full border border-white/10 text-center"><div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">✓</div><h2 class="text-xl font-black">Reservado!</h2><p class="text-white/60 text-sm mt-2">Pague R$ ${total.toFixed(2)} no PIX</p><div class="mt-4 bg-black p-4 rounded-xl"><p class="text-xs text-white/40">CHAVE PIX</p><p class="font-mono break-all mt-1 text-sm">${currentRifa.pix}</p><button onclick="navigator.clipboard.writeText('${currentRifa.pix}');alert('PIX copiado!')" class="mt-3 w-full bg-white text-black py-2 rounded-full font-bold text-sm">Copiar PIX</button></div><a href="https://wa.me/55${currentRifa.whatsapp}?text=Reservei%20${nums.length}%20numeros%20na%20${encodeURIComponent(currentRifa.titulo)}" target="_blank" class="block mt-3 w-full bg-green-600 p-3 rounded-xl font-bold">WhatsApp Dono</a><button onclick="document.getElementById('modal').classList.add('hidden')" class="mt-3 text-white/50 text-sm">Fechar</button></div></div>`;
  document.getElementById('modal').classList.remove('hidden'); await loadNumeros(currentRifa.id);
}

async function abrirGerenciar(rifaId){
  const div=document.getElementById('ger-'+rifaId); div.classList.toggle('hidden'); if(div.classList.contains('hidden')) return;
  div.innerHTML='Carregando...'; const {data}=await supabaseClient.from('numeros').select('*').eq('rifa_id',rifaId).order('numero');
  div.innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2">${data.map(n=>`<div class="bg-black/40 p-2 rounded-xl text-xs"><b>${String(n.numero).padStart(2,'0')}</b> - ${n.status}<br>${n.comprador_nome||'-'}<div class="flex gap-1 mt-1"><button onclick="mudarStatus('${rifaId}',${n.numero},'pago')" class="bg-green-600 px-2 py-1 rounded">Pago</button><button onclick="mudarStatus('${rifaId}',${n.numero},'disponivel')" class="bg-white/10 px-2 py-1 rounded">Liberar</button></div></div>`).join('')}</div><button onclick="sortear('${rifaId}')" class="mt-4 w-full bg-violet-600 p-3 rounded-xl font-bold">Sortear Vencedor</button>`;
}

async function mudarStatus(rifaId,numero,status){
  let upd={status}; if(status==='disponivel') upd={status,comprador_nome:null,comprador_whats:null};
  await supabaseClient.from('numeros').update(upd).eq('rifa_id',rifaId).eq('numero',numero); abrirGerenciar(rifaId); setTimeout(()=>abrirGerenciar(rifaId),300);
}

async function sortear(rifaId){
  const {data}=await supabaseClient.from('numeros').select('*').eq('rifa_id',rifaId).in('status',['pago','reservado']);
  if(!data.length) return alert('Nenhum vendido'); const v=data[Math.floor(Math.random()*data.length)]; alert(`VENCEDOR: Nº ${v.numero} - ${v.comprador_nome} - ${v.comprador_whats}`);
}

init();
</script>
</body>
</html>
